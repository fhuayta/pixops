[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pixops"
version = "0.1.1"
description = "Local image utilities: resize, convert, compress, grayscale, canvas."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
  { name = "Franz Huayta Quevedo" },
]
keywords = [
  "image-processing",
  "resize",
  "webp",
  "cli",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pixops = "pixops.cli:main"

[project.urls]
Homepage = "https://github.com/fhuayta/pixops"
Source = "https://github.com/fhuayta/pixops"
Issues = "https://github.com/fhuayta/pixops/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pixops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
